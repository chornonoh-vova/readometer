services:
  migration:
    image: ghcr.io/chornonoh-vova/readometer-api:latest
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
    command: ["bun", "run", "db:migrate", "latest"]
  api:
    image: ghcr.io/chornonoh-vova/readometer-api:latest
    restart: unless-stopped
    depends_on:
      dragonfly:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    deploy:
      replicas: 2
    networks:
      - database
    environment:
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://readometer.app
      - TRUSTED_ORIGINS=https://readometer.app
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - STORAGE_PATH=/storage
    volumes:
      - storage_data:/storage
  web:
    image: ghcr.io/chornonoh-vova/readometer-web:latest
    restart: unless-stopped
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - database
    environment:
      - DFLY_requirepass=${REDIS_PASSWORD}
    volumes:
      - dragonfly_data:/data

volumes:
  storage_data:
  dragonfly_data:

networks:
  database:
