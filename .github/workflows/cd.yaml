name: CD

on:
  workflow_run:
    workflows:
      - "CI"
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

# Runs are serialized rather than cancelled: two runs racing to push :latest can
# finish out of order and leave that tag pointing at an older commit than the
# digest tag beside it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# workflow_run runs in the context of the default branch, so github.sha is main's
# tip at start time rather than the commit whose CI passed. Everything below
# builds, tags, and reports against this value instead.
env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-publish:
    name: ${{ matrix.image }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: .
            file: apps/api/Dockerfile
            image: chornonoh-vova/readometer-api
          - context: .
            file: apps/web/Dockerfile
            image: chornonoh-vova/readometer-web
          - context: .
            file: apps/notifications/Dockerfile
            image: chornonoh-vova/readometer-notifications
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.context }}
          push: true
          file: ${{ matrix.file }}
          build-args: |
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
          secrets: |
            site-key=${{ secrets.TURNSTILE_SITE_KEY }}
          tags: |
            ghcr.io/${{ matrix.image }}:${{ env.DEPLOY_SHA }}
            ghcr.io/${{ matrix.image }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
