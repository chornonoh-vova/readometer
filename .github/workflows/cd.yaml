name: CD

on:
  workflow_run:
    workflows:
      - "CI"
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

# Deploys are serialized rather than cancelled: killing a rollout midway leaves
# the stack in an unknown state, and racing image builds are what produces
# mismatched :latest tags in the first place.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# workflow_run runs in the context of the default branch, so github.sha is main's
# tip at start time rather than the commit whose CI passed. Everything below
# builds, tags, and reports against this value instead.
env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-publish:
    name: ${{ matrix.image }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: .
            file: apps/api/Dockerfile
            image: chornonoh-vova/readometer-api
          - context: .
            file: apps/web/Dockerfile
            image: chornonoh-vova/readometer-web
          - context: .
            file: apps/notifications/Dockerfile
            image: chornonoh-vova/readometer-notifications
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.context }}
          push: true
          file: ${{ matrix.file }}
          build-args: |
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
          secrets: |
            site-key=${{ secrets.TURNSTILE_SITE_KEY }}
          tags: |
            ghcr.io/${{ matrix.image }}:${{ env.DEPLOY_SHA }}
            ghcr.io/${{ matrix.image }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://readometer.app
    env:
      DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
      DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
    steps:
      - name: Deploy compose stack and wait for it to settle
        run: |
          set -euo pipefail

          echo "Deploying ${DEPLOY_SHA}"

          list_deployments() {
            curl --fail-with-body -sS \
              -H "x-api-key: ${DOKPLOY_API_KEY}" \
              "${DOKPLOY_URL}/api/deployment.allByCompose?composeId=${DOKPLOY_COMPOSE_ID}"
          }

          # deployment.allByCompose has documented parameters but no documented
          # response schema, so unwrap the shapes it plausibly returns and fail
          # loudly (printing the body) rather than silently matching nothing.
          normalize() {
            jq -e 'if type == "array" then .
                   elif has("data") then .data
                   elif has("result") then (.result.data.json // .result.data)
                   else error("unrecognized shape") end'
          }

          ids_of() { jq -r '[.[] | (.deploymentId // .id)] | @json'; }

          raw=$(list_deployments)
          if ! before=$(printf '%s' "$raw" | normalize 2>/dev/null | ids_of); then
            echo "::error::Could not parse deployment.allByCompose. Raw response:"
            printf '%s\n' "$raw"
            exit 1
          fi

          echo "Triggering deploy of compose ${DOKPLOY_COMPOSE_ID}"
          curl --fail-with-body -sS -X POST \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            --data "{\"composeId\":\"${DOKPLOY_COMPOSE_ID}\"}" \
            "${DOKPLOY_URL}/api/compose.deploy"
          echo

          logged=0
          for _ in $(seq 1 90); do
            sleep 10

            current=$(list_deployments | normalize)
            deployment=$(printf '%s' "$current" | jq -c --argjson before "$before" \
              '[.[] | select((.deploymentId // .id) as $id | ($before | index($id)) | not)] | first // empty')

            if [ -z "$deployment" ]; then
              echo "Waiting for Dokploy to register the deployment..."
              continue
            fi

            if [ "$logged" -eq 0 ]; then
              echo "Tracking deployment:"
              printf '%s\n' "$deployment" | jq .
              logged=1
            fi

            status=$(printf '%s' "$deployment" | jq -r '.status // "unknown"')
            case "$status" in
              done|success|completed)
                echo "Deployment finished: ${status}"
                exit 0
                ;;
              error|failed|cancelled|canceled)
                echo "::error::Deployment finished: ${status}"
                printf '%s\n' "$deployment" | jq .
                exit 1
                ;;
              *)
                echo "Deployment status: ${status}"
                ;;
            esac
          done

          echo "::error::Timed out after 15 minutes waiting for the deployment to settle."
          exit 1
