services:
  traefik:
    image: traefik:3.7.9
    networks:
      - proxy
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=true"
      - "--providers.docker.network=proxy"
      - "--entryPoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
  migration:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    image: readometer-api:dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
    command: ["bun", "run", "db:migrate", "latest"]
  api:
    image: readometer-api:dev
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - proxy
      - database
    environment:
      - NODE_ENV=development
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=http://readometer.local
      - TRUSTED_ORIGINS=http://readometer.local
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - STORAGE_PATH=/storage
    volumes:
      - ./apps/api/storage:/storage
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`readometer.local`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
  notifications:
    build:
      context: .
      dockerfile: ./apps/notifications/Dockerfile
    image: readometer-notifications:dev
    depends_on:
      dragonfly:
        condition: service_healthy
    networks:
      - database
    environment:
      - NODE_ENV=development
      - REDIS_URL=${REDIS_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM}
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      secrets:
        - site-key
    image: readometer-web:dev
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`readometer.local`)"
      - "traefik.http.routers.app.entrypoints=web"
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - database
    ports:
      - "6379:6379"
    environment:
      - DFLY_requirepass=${REDIS_PASSWORD}
      - DFLY_cluster_mode=emulated
      - DFLY_lock_on_hashtags=true
    volumes:
      - dragonfly_data:/data
  postgres:
    image: postgres:18.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d readometer"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - database
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=readometer
    volumes:
      - postgres_data:/var/lib/postgresql
  mailpit:
    image: axllent/mailpit:v1.30.6
    networks:
      - database
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      - MP_DATABASE=/data/mailpit.db
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
  dragonfly_data:
  mailpit_data:

networks:
  proxy:
    name: proxy
  database:
    name: database

secrets:
  site-key:
    environment: TURNSTILE_SITE_KEY
